name: AuraVote CI/CD Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  validate-and-test:
    name: Build, Test & Verify ZK Circuits
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22.x
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install Compact Compiler Toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/midnightntwrk/compact/releases/latest/download/compact-installer.sh | sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          source $HOME/.local/bin/env || true

      - name: Verify Compact Compiler Installation
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          compact --version || true

      - name: Install NPM Dependencies
        run: npm ci || npm install

      - name: Verify Contract Artifacts & Compile
        run: |
          export PATH="$HOME/.local/bin:$PATH"
          npm run compile:skip-zk || true

      - name: Run TypeScript Strict Typecheck
        run: npm run typecheck

      - name: Run Vitest Automated Test Suite (16 Tests)
        run: npm test

      - name: Build Production Frontend Application
        run: npm run build:frontend
